<!DOCTYPE html>
<html>


<body>
    <div id="btn"></div>
    <script>
        let state = {
            count: 0,
            bgcolor: "green"
        }
        function onButtonPress() {
            state.count++;
            state.bgcolor = Math.random() > 0.5 ? "#239483" : "#d9da74";
            buttonComponentReRender();
        }

        function buttonComponentReRender() {
            document.querySelector("#btn").innerHTML = "";
            const component = buttonComponent(state.count, state.bgcolor);
            document.querySelector("#btn").appendChild(component);
        }

        function buttonComponent(count, color) {
            const button = document.createElement("button");
            button.innerHTML = `Conter ${count}`;
            button.setAttribute("onclick", `onButtonPress()`);
            button.setAttribute("style", `background-color: ${color}`)
            return button;
        }

        onButtonPress();
    </script>
</body>

</html>
